services:
  postgres:
    image: postgres:16-alpine
    container_name: faceoff-postgres
    environment:
      POSTGRES_USER: faceoff
      POSTGRES_PASSWORD: faceoff
      POSTGRES_DB: faceoff
    ports:
      - "5433:5432"
    volumes:
      - faceoff-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceoff"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: faceoff-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  faceoff-pgdata:
