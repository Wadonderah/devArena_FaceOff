name: CI
on:
  pull_request:
  push: { branches: [main] }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      # Tests were never run in CI, so a broken one could merge unnoticed. The
      # root script covers both apps/api and apps/web.
      - run: pnpm test
